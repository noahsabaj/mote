[project]
name = "mote"
version = "0.1.0"
description = "Byte-level H-Net language model (Mamba-3 encoder/decoder, Relation main network) and the studio that trains and serves it."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["COPYRIGHT", "LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "numpy>=1.26",
    "datasets>=2.18.0",
    "huggingface_hub>=0.23",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "qrcode>=8",
    "pytest>=8.0.0",
    "esper>=3.8",
]

[project.scripts]
mote = "mote.cli:main"

[project.optional-dependencies]
# Official Mamba-3 Triton kernels: Linux / WSL2 only. Install from the upstream source tree:
#   MAMBA_SKIP_CUDA_BUILD=TRUE pip install -e /path/to/state-spaces/mamba --no-deps --no-build-isolation
# plus `triton>=3.5 einops`. Without them the pure-PyTorch paths are used automatically.
cloud = ["lightning-sdk>=2026.8"]

[build-system]
requires = ["setuptools>=77.0"]  # PEP 639 SPDX license expression
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mote*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
