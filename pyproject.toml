[project]
name = "sisa-mamba"
version = "0.1.0"
description = "High-performance PyTorch library integrating SISA (SSM-Informed Softmax Attention) and Mamba-3 architectures, with byte-level sequence modeling, interactive Web UI, and scientific benchmarks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "einops>=0.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "rich>=13.7.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
